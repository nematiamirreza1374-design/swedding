<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<base href="./">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>دعوتنامه عروسی</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    font-family: Tahoma, 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    background: #eaddcf;
  }

  /* ============ صفحه ویدیو مقدمه ============ */
  #introScreen {
    position: fixed; inset: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    background: #1a1510;
    transition: opacity 1s ease;
  }

  #introScreen.fade-out {
    opacity: 0;
    pointer-events: none;
  }

  #introVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #1a1510;
  }

  /* دکمه رد کردن ویدیو */
  .skip-btn {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    padding: 10px 22px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 25;
  }
  .skip-btn.visible { opacity: 1; }
  .skip-btn:active { transform: translateX(-50%) scale(0.96); }

  /* ============ صفحه کارت ============ */
  #cardScreen {
    position: fixed; inset: 0; z-index: 5;
    display: flex; flex-direction: column;
    background: #2a221c;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }

  #cardScreen.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .card-image {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: #eaddcf;
    z-index: 1;
    animation: cardZoomIn 1.3s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes cardZoomIn {
    0% { opacity: 0; transform: scale(1.2); filter: blur(10px); }
    100% { opacity: 1; transform: scale(1); filter: blur(0); }
  }

  .overlay-content {
    position: relative; z-index: 3;
    flex: 1; display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 18px 16px 26px;
    background: linear-gradient(to top, rgba(15,10,5,0.7) 0%, rgba(15,10,5,0.2) 45%, transparent 70%);
    pointer-events: none;
  }

  .overlay-content > * { pointer-events: auto; }

  .options { display: grid; gap: 10px; margin-bottom: 12px; }

  .option {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 15px 12px; border-radius: 16px;
    text-decoration: none; color: #fff; font-size: 14.5px; font-weight: 600;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    transition: transform 0.2s, background 0.2s;
    animation: slideUp 0.9s ease 0.8s both;
  }

  .option:active { 
    transform: scale(0.97); 
    background: rgba(255,255,255,0.28);
  }

  .countdown {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 16px;
    padding: 14px 10px; 
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    animation: slideUp 0.9s ease 1s both;
  }

  @keyframes slideUp {
    0% { opacity: 0; transform: translateY(35px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .count-title {
    font-size: 13px; 
    color: #fff; 
    margin-bottom: 10px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .timer {
    display: flex; 
    justify-content: center; 
    gap: 7px; 
    direction: ltr;
  }

  .unit {
    background: rgba(255,255,255,0.92);
    border-radius: 10px; 
    padding: 8px 5px;
    min-width: 54px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  .num { display: block; font-size: 18px; font-weight: 700; color: #4a3b2f; }
  .lbl { display: block; font-size: 10px; color: #6b5a4b; margin-top: 2px; }

  /* دکمه موسیقی */
  .music-btn {
    position: fixed; 
    left: 16px; 
    bottom: 16px; 
    z-index: 20;
    width: 48px; 
    height: 48px; 
    border: none; 
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    font-size: 22px; 
    cursor: pointer;
    display: flex; 
    align-items: center; 
    justify-content: center;
    opacity: 0; 
    transform: scale(0.8);
    transition: opacity 0.5s, transform 0.4s;
  }
  .music-btn.visible { 
    opacity: 1; 
    transform: scale(1);
  }
  .music-btn:active { transform: scale(0.92); }
</style>
</head>
<body>

  <!-- صفحه ویدیو مقدمه (۵ ثانیه) -->
  <section id="introScreen">
    <video id="introVideo" 
           src="./intro.mp4" 
           playsinline 
           muted 
           autoplay
           preload="auto">
    </video>
    <button class="skip-btn" id="skipBtn">رد کردن ›</button>
  </section>

  <!-- صفحه کارت دعوت -->
  <section id="cardScreen">
    <img src="./wedding_card.jpg" alt="کارت دعوت عروسی" class="card-image" onerror="this.style.background='#eaddcf'">
    
    <div class="overlay-content">
      <div class="options">
        <a class="option" href="https://www.google.com/maps/place/%D8%A8%D8%A7%D8%BA+%D8%AA%D8%A7%D9%84%D8%A7%D8%B1+%D9%BE%D8%A7%D8%B1%D9%85%DB%8C%D8%B3%E2%80%AD/data=!4m2!3m1!1s0x0:0x1ba75c8d9795a072?sa=X&ved=1t:2428&ictx=111" target="_blank" rel="noopener">
          📍 مشاهده لوکیشن مراسم روی Google Maps
        </a>
      </div>

      <div class="countdown">
        <div class="count-title">تا شروع مراسم</div>
        <div id="timer" class="timer">
          <div class="unit"><span id="days" class="num">--</span><span class="lbl">روز</span></div>
          <div class="unit"><span id="hours" class="num">--</span><span class="lbl">ساعت</span></div>
          <div class="unit"><span id="minutes" class="num">--</span><span class="lbl">دقیقه</span></div>
          <div class="unit"><span id="seconds" class="num">--</span><span class="lbl">ثانیه</span></div>
        </div>
      </div>
    </div>
  </section>

  <audio id="music" src="./wedding_music.mp3" loop preload="auto"></audio>
  <button id="musicBtn" class="music-btn" aria-label="پخش یا توقف موسیقی">🔊</button>

  <script>
    const introScreen = document.getElementById('introScreen');
    const introVideo = document.getElementById('introVideo');
    const cardScreen = document.getElementById('cardScreen');
    const music = document.getElementById('music');
    const musicBtn = document.getElementById('musicBtn');
    const skipBtn = document.getElementById('skipBtn');

    let hasTransitioned = false;
    let musicStarted = false;

    // شروع موسیقی
    async function startMusic() {
      if (musicStarted) return;
      try {
        await music.play();
        musicStarted = true;
        musicBtn.textContent = '🔊';
      } catch (e) {
        // مرورگر ممکن است پخش خودکار صدادار را تا اولین تعامل کاربر مسدود کند.
      }
    }

    // تلاش برای پخش موسیقی از همان ابتدای ورود
    startMusic();

    // با اولین لمس/کلیک/فشار کلید، محدودیت autoplay را دور می‌زنیم.
    function firstInteraction() {
      startMusic();
      document.removeEventListener('pointerdown', firstInteraction);
      document.removeEventListener('touchstart', firstInteraction);
      document.removeEventListener('keydown', firstInteraction);
    }

    document.addEventListener('pointerdown', firstInteraction, { once: true });
    document.addEventListener('touchstart', firstInteraction, { once: true });
    document.addEventListener('keydown', firstInteraction, { once: true });

    // نمایش دکمه رد کردن بعد از ۱.۵ ثانیه
    setTimeout(() => {
      skipBtn.classList.add('visible');
    }, 1500);

    function goToCard() {
      if (hasTransitioned) return;
      hasTransitioned = true;

      // توقف ویدیو
      introVideo.pause();

      // محو شدن صفحه ویدیو
      introScreen.classList.add('fade-out');

      // نمایش صفحه کارت
      setTimeout(() => {
        introScreen.style.display = 'none';
        cardScreen.classList.add('visible');
        musicBtn.classList.add('visible');

        // شروع موسیقی هنگام ورود به کارت
        startMusic();
      }, 900);
    }

    // وقتی ویدیو تموم شد
    introVideo.addEventListener('ended', goToCard);

    // دکمه رد کردن
    skipBtn.addEventListener('click', goToCard);

    // اگر ویدیو به هر دلیلی پخش نشد، بعد از ۶ ثانیه برو
    setTimeout(() => {
      if (!hasTransitioned) goToCard();
    }, 6000);

    // تلاش برای پخش ویدیو
    introVideo.play().catch(() => {
      // اگر خودکار پخش نشد، unmute کن و دوباره تلاش کن
      introVideo.muted = false;
      introVideo.play().catch(() => {
        console.log("پخش خودکار ویدیو مسدود شد.");
      });
    });

    // کنترل موسیقی
    musicBtn.addEventListener('click', async () => {
      if (music.paused) {
        await startMusic();
      } else {
        music.pause();
        musicBtn.textContent = '🔇';
        musicStarted = false;
      }
    });

    // تایمر معکوس - ۲۹ مهر ۱۴۰۵ ساعت ۱۸:۰۰
    const weddingDate = new Date('2026-10-21T18:00:00+03:30').getTime();

    function updateCountdown(){
      const diff = weddingDate - Date.now();
      if(diff <= 0){
        document.getElementById('timer').innerHTML =
          '<div style="font-weight:bold;font-size:16px;color:#fff;">مراسم آغاز شده است ❤️</div>';
        return;
      }
      document.getElementById('days').textContent = Math.floor(diff / 86400000);
      document.getElementById('hours').textContent = Math.floor((diff % 86400000) / 3600000);
      document.getElementById('minutes').textContent = Math.floor((diff % 3600000) / 60000);
      document.getElementById('seconds').textContent = Math.floor((diff % 60000) / 1000);
    }
    
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
